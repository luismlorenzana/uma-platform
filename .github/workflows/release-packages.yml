name: Release packages

# Publishes every package whose version isn't on GitHub Packages yet (README.md#releasing-a-package).
# Versions are bumped on main with `pnpm version-packages` (Changesets), so this job only ever publishes.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.changeset/**'
      - '.github/workflows/release-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js with the GitHub Packages registry
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@luismlorenzana'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm lint
          pnpm test:ci
          pnpm build

      - name: Set a git identity for release tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The Verify step built every package in dependency order; the packages' prepacks skip a second build here, so
      # packages published together never rebuild (and clear) a dist another is compiling against (P172).
      - name: Publish unpublished versions
        run: pnpm publish-packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UMA_PACKAGES_BUILT: '1'

      - name: Push release tags
        run: git push origin --tags
