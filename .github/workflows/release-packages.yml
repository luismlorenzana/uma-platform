name: Release packages

# Publishes every package whose version isn't on GitHub Packages yet (README.md#releasing-a-package).
# Versions are bumped on main with `pnpm version-packages` (Changesets), so this job only ever publishes.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.changeset/**'
      - '.github/workflows/release-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js with the GitHub Packages registry
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@luismlorenzana'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm lint
          pnpm test
          pnpm build

      - name: Publish unpublished versions
        run: pnpm publish-packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push release tags
        run: git push origin --tags
